splits:
  # ---------------------------------------------------------------------------
  # Tiny smoke-test split
  # Already used by all runner tests.
  # ---------------------------------------------------------------------------
  - id: _runner_core_split_v1
    dataset_id: _runner_core_test
    name: "Tiny runner smoke-test split"
    method: stratified
    test_size: 0.2
    seed: 42
    train_indices: "results/splits/_runner_core_split_v1/train_idx.npy"
    test_indices: "results/splits/_runner_core_split_v1/test_idx.npy"
    enabled: true
    smoke_test: true

  # ---------------------------------------------------------------------------
  # Main thesis split
  # This will be used for the prepared CIC DDoS superset.
  # ---------------------------------------------------------------------------
  - id: cic_superset_split_v1
    dataset_id: cic_superset
    name: "Prepared CIC DDoS superset stratified 80/20 split"
    method: stratified
    test_size: 0.2
    seed: 42
    train_indices: "results/splits/cic_superset_split_v1/train_idx.npy"
    test_indices: "results/splits/cic_superset_split_v1/test_idx.npy"
    enabled: true
    smoke_test: false

  # ---------------------------------------------------------------------------
  # Optional alternative split
  # Keep disabled for now. Useful later if a second robustness check is needed.
  # ---------------------------------------------------------------------------
  - id: cic_superset_split_v2_seed123
    dataset_id: cic_superset
    name: "Prepared CIC DDoS superset stratified 80/20 split seed 123"
    method: stratified
    test_size: 0.2
    seed: 123
    train_indices: "results/splits/cic_superset_split_v2_seed123/train_idx.npy"
    test_indices: "results/splits/cic_superset_split_v2_seed123/test_idx.npy"
    enabled: false
    smoke_test: false

  # ---------------------------------------------------------------------------
  # Danilo trusted botnet-balanced CIC-like dataset splits
  # ---------------------------------------------------------------------------
  - id: realworld_botnet_balanced_cic_100k_split_v1
    dataset_id: realworld_botnet_balanced_cic_100k
    name: "Real-world botnet-balanced CIC-like 100k stratified 80/20 split"
    method: stratified
    test_size: 0.2
    seed: 42
    train_indices: "results/splits/realworld_botnet_balanced_cic_100k_split_v1/train_idx.npy"
    test_indices: "results/splits/realworld_botnet_balanced_cic_100k_split_v1/test_idx.npy"
    enabled: true
    smoke_test: false

  - id: realworld_botnet_balanced_cic_full_split_v1
    dataset_id: realworld_botnet_balanced_cic_full
    name: "Real-world botnet-balanced CIC-like full stratified 80/20 split"
    method: stratified
    test_size: 0.2
    seed: 42
    train_indices: "results/splits/realworld_botnet_balanced_cic_full_split_v1/train_idx.npy"
    test_indices: "results/splits/realworld_botnet_balanced_cic_full_split_v1/test_idx.npy"
    enabled: true
    smoke_test: false

  - id: realworld_botnet_balanced_cic_100k_strict_split_v1
    dataset_id: realworld_botnet_balanced_cic_100k_strict
    name: "Real-world botnet-balanced CIC-like 100k strict stratified 80/20 split"
    method: stratified
    test_size: 0.2
    seed: 42
    train_indices: "results/splits/realworld_botnet_balanced_cic_100k_strict_split_v1/train_idx.npy"
    test_indices: "results/splits/realworld_botnet_balanced_cic_100k_strict_split_v1/test_idx.npy"
    enabled: true
    smoke_test: false
