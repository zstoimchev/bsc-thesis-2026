datasets:
- id: _runner_core_test
  name: Tiny runner smoke-test dataset
  path: results/_runner_core_test.csv
  split_type: generated
  label_col: label
  problem_type: binary
  enabled: true
  smoke_test: true
  drop_columns: []
- id: cic_superset
  name: Prepared CIC DDoS superset
  path: data/raw/cic_superset.parquet
  split_type: generated
  label_col: null
  problem_type: binary
  enabled: true
  smoke_test: false
  drop_columns:
  - Flow ID
  - Src IP
  - Dst IP
  - Source IP
  - Destination IP
  - Timestamp
  - SimillarHTTP
  - 'Unnamed: 0'
- id: cic_ddos2019_predefined
  name: CIC-DDoS2019 predefined train/test
  train_path: data/original_datasets/CIC-DDoS-2019/cic_ddos2019_train.csv
