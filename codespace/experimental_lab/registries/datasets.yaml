- id: realworld_botnet_balanced_cic_full
  name: Real-world botnet-balanced CIC-like dataset full
  path: data/raw/realworld_botnet_balanced/realworld_cic_like_botnet_balanced.parquet
  split_type: generated
  label_col: label
  problem_type: binary
  enabled: true
  smoke_test: false
  note: Full Danilo trusted botnet-balanced CIC-like dataset.
  drop_columns:
  - src_ip
  - dst_ip
  - flow_start_ts
  - flow_end_ts
  - capture_file
  - capture_start_utc
  - capture_end_utc
  - label_source
- id: realworld_botnet_balanced_cic_100k_strict
  name: Real-world botnet-balanced CIC-like dataset 100k strict
  path: data/prepared/realworld_botnet_balanced_cic_100k.parquet
  split_type: generated
  label_col: label
  problem_type: binary
  enabled: true
  smoke_test: false
  note: Strict 100k evaluation dataset with metadata, ports, protocol, and obvious
    shortcut columns removed.
  drop_columns:
  - src_ip
  - dst_ip
  - src_port
  - dst_port
  - protocol
  - flow_start_ts
  - flow_end_ts
  - capture_file
  - capture_start_utc
  - capture_end_utc
  - captured_port_in_scope
  - label_source
- id: transfer_cicddos2019_native_aligned
  name: 'Transfer baseline: train CIC-DDoS2019 aligned, test CIC-DDoS2019 aligned'
  train_path: data/prepared/transfer_cicddos2019_to_botnet_full/train_cicddos2019_original_aligned.parquet
  test_path: data/prepared/transfer_cicddos2019_to_botnet_full/test_cicddos2019_original_aligned.parquet
  split_type: predefined
  label_col: label
  problem_type: binary
  enabled: true
  smoke_test: false
  note: Native baseline using the same aligned 17-feature space as the transfer experiment.
  drop_columns: []
- id: transfer_cicddos2019_to_botnet_balanced_full_strict
  name: 'Transfer: train CIC-DDoS2019 aligned, test full botnet-balanced CIC-like'
  train_path: data/prepared/transfer_cicddos2019_to_botnet_full/train_cicddos2019_original_aligned.parquet
  test_path: data/prepared/transfer_cicddos2019_to_botnet_full/test_botnet_balanced_full_aligned.parquet
  split_type: predefined
  label_col: label
  problem_type: binary
  enabled: true
  smoke_test: false
  note: Cross-dataset transfer experiment. Trains on original CIC-DDoS2019 and evaluates
    on the full Danilo botnet-balanced dataset. Botnet-balanced is external test only.
  drop_columns: []
- id: matrix_cic_train_cic_test
  name: 'Matrix: train CIC-DDoS2019, test CIC-DDoS2019'
  train_path: data/prepared/transfer_cicddos2019_to_botnet_full/train_cicddos2019_original_aligned.parquet
  test_path: data/prepared/transfer_cicddos2019_to_botnet_full/test_cicddos2019_original_aligned.parquet
  split_type: predefined
  label_col: label
  problem_type: binary
  enabled: true
  smoke_test: false
  note: 'Original to original: train on CIC-DDoS2019 and test on CIC-DDoS2019.'
  drop_columns: []
- id: matrix_cic_train_botnet_test
  name: 'Matrix: train CIC-DDoS2019, test botnet-balanced'
  train_path: data/prepared/transfer_cicddos2019_to_botnet_full/train_cicddos2019_original_aligned.parquet
  test_path: data/prepared/transfer_cicddos2019_to_botnet_full/test_botnet_balanced_aligned.parquet
  split_type: predefined
  label_col: label
  problem_type: binary
  enabled: true
  smoke_test: false
  note: 'Original to other: train on CIC-DDoS2019 and test on botnet-balanced.'
  drop_columns: []
- id: matrix_botnet_train_botnet_test
  name: 'Matrix: train botnet-balanced, test botnet-balanced'
  train_path: data/prepared/transfer_cicddos2019_to_botnet_full/train_botnet_balanced_aligned.parquet
  test_path: data/prepared/transfer_cicddos2019_to_botnet_full/test_botnet_balanced_aligned.parquet
  split_type: predefined
  label_col: label
  problem_type: binary
  enabled: true
  smoke_test: false
  note: 'Other to other: train on botnet-balanced and test on botnet-balanced.'
  drop_columns: []
- id: matrix_botnet_train_cic_test
  name: 'Matrix: train botnet-balanced, test CIC-DDoS2019'
  train_path: data/prepared/transfer_cicddos2019_to_botnet_full/train_botnet_balanced_aligned.parquet
  test_path: data/prepared/transfer_cicddos2019_to_botnet_full/test_cicddos2019_original_aligned.parquet
  split_type: predefined
  label_col: label
  problem_type: binary
  enabled: true
  smoke_test: false
  note: 'Other to original: train on botnet-balanced and test on CIC-DDoS2019.'
  drop_columns: []
