  split_type: predefined
  label_col: null
  problem_type: binary
  enabled: true
  smoke_test: false
  drop_columns:
  - Flow ID
  - Src IP
  - Dst IP
  - Source IP
  - Destination IP
  - Timestamp
  - SimillarHTTP
  - 'Unnamed: 0'
